# ==============================================================================
# Search Portals & Aggregators Configuration
# ==============================================================================

# python-jobspy generalist search parameters
jobspy:
  sites:
    - "linkedin"
    - "indeed"
    - "glassdoor"
    - "google"
  search_terms:
    - "Quantum Software Engineer"
    - "Quantum Computing Software"
    - "Quantum SDK Developer"
    - "Quantum Algorithms Python"
    - "Quantum Compiler Engineer"
    - "Junior Quantum Software"
    - "Quantum Computing Residency"
  locations:
    - "Remote"
    - "United States"
    - "Europe"
    - "United Kingdom"
    - "Canada"
  results_wanted: 25
  hours_old: 72
  country_indeed: "USA"
  is_remote: true
  description_format: "markdown"

# Niche portals and community boards for specialized crawlers (Crawl4AI)
# parser: unitary_fund | generic_page (stores the whole page as ONE posting; only for single-job URLs)
niche_portals:
  - name: "Unitary Fund Job Board"
    url: "https://unitary.fund/jobs/"
    category: "quantum_open_source"
    enabled: false
    parser: "unitary_fund"
    notes: "Disabled: moved to unitary.foundation and no longer publishes a job list (HTTP 404)."

  - name: "Quantum Jobs Org"
    url: "https://quantumjobs.org/"
    category: "quantum_niche"
    enabled: false
    parser: "quantum_jobs"
    notes: "Disabled: the domain is parked for sale and has no listings."
