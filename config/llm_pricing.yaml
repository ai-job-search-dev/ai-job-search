# USD per one million tokens, used to estimate cost and enforce --max-cost.
# These figures are an editable snapshot, not a source of truth: check your provider's pricing page.
# A model that is not listed still works; its calls are counted in tokens and flagged as unpriced,
# and a cost cap cannot be enforced for it.
models:
  gpt-4o-mini: { input: 0.15, output: 0.60 }
  gpt-4o: { input: 2.50, output: 10.00 }
  gpt-4.1-mini: { input: 0.40, output: 1.60 }
  gpt-4.1: { input: 2.00, output: 8.00 }
